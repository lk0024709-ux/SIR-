name: Android debug APK

on:
  pull_request:
    paths:
      - "android/**"
      - "cmake/llama_cpp.cmake"
      - "docs/android-build.md"
      - ".github/workflows/android-apk.yml"
  push:
    branches:
      - main
      - arena/01a10c78-sir
    paths:
      - "android/**"
      - "cmake/llama_cpp.cmake"
      - "docs/android-build.md"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Build pinned Android/JNI debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pinned Android command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: true
          packages: ""

      - name: Install pinned Android SDK components
        run: >-
          sdkmanager --install
          "platforms;android-35"
          "build-tools;36.0.0"
          "ndk;28.2.13676358"
          "cmake;3.22.1"

      - name: Configure Gradle caching
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Verify Java and Gradle versions
        working-directory: android
        run: |
          java -version 2>&1 | tee /tmp/java-version.txt
          grep -Eq 'version "17([.]|")' /tmp/java-version.txt
          ./gradlew --version

      - name: Build debug APK (Kotlin + NDK + pinned llama.cpp)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK and JNI library payloads
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          if not apk.is_file() or apk.stat().st_size == 0:
              raise SystemExit(f"APK missing or empty: {apk}")
          expected = {
              "lib/arm64-v8a/libsir_android.so",
              "lib/x86_64/libsir_android.so",
          }
          with ZipFile(apk) as archive:
              names = set(archive.namelist())
          missing = sorted(expected - names)
          if missing:
              raise SystemExit(f"APK missing JNI libraries: {missing}")
          print(f"Verified {apk} ({apk.stat().st_size} bytes) and JNI libraries for both configured ABIs")
          PY

      - name: Upload verified debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sir-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
