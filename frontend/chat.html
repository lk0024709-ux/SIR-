<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIR - AI Guru Chat</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #e74c3c;
            --success: #27ae60;
            --background: #f4f6f8;
            --card: #ffffff;
            --text: #2c3e50;
            --muted: #7f8c8d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Chat container */
        #chat-container {
            flex: 1;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        /* Messages */
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .message.user {
            align-self: flex-end;
            background: var(--primary);
            color: white;
        }

        .message.agent {
            align-self: flex-start;
            background: var(--card);
            border: 1px solid #e0e0e0;
        }

        /* Input area */
        #-input-area {
            padding: 12px 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        #user-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #user-input:focus {
            border-color: var(--primary);
        }

        #send-btn {
            padding: 0 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        #send-btn:hover {
            background: #34495e;
        }

        /* Status bar */
        #status-bar {
            padding: 8px 20px;
            color: var(--muted);
            font-size: 0.75rem;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        /* Reduced motion for accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none;
            }
        }

        /* Android optimizations */
        @media (pointer: coarse) {
            #user-input {
                padding: 12px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="chat-container" role="region" aria-label="AI Guru Chat">
        <!-- Messages will be injected here -->
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Ask AI Guru..." autocomplete="off">
        <button type="button" id="send-btn">Send</button>
    </div>

    <div id="status-bar">
        AI Guru ready • Type your question
    </div>

    <script>
        // Chat state
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // Render a message
        function renderMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'agent'}`;
            div.setAttribute('role', 'status');
            div.setAttribute('aria-live', 'polite');
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Send message to AI Guru
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // User message
            renderMessage(text, true);
            userInput.value = '';

            // Show typing indicator
            renderMessage("AI Guru is thinking...", false);

            try {
                // Send to server endpoint
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                
                // Remove typing indicator and replace with actual response
                const lastChild = chatContainer.lastElementChild;
                if (lastChild && lastChild.textContent === "AI Guru is thinking...") {
                    chatContainer.removeChild(lastChild);
                }
                
                if (response.error) {
                    renderMessage(`Error: ${response.error}`, false);
                } else {
                    renderMessage(response.response || "No response received", false);
                }
            } catch (err) {
                // Remove typing indicator
                const lastChild = chatContainer.lastElementChild;
                if (lastChild && lastChild.textContent === "AI Guru is thinking...") {
                    chatContainer.removeChild(lastChild);
                }
                renderMessage("Connection error. Please try again.", false);
                console.error('Chat error:', err);
            }
        }

// Handle Enter key (Shift+Enter for new line)
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Send button
        sendBtn.addEventListener('click', sendMessage);

        // Focus input on load
        userInput.focus();
    </script>
</body>
</html>
