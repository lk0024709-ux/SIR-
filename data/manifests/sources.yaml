- id: standardebooks_en_pd
  name: Standard Ebooks public-domain English literature (deterministic subset)
  provider: Standard Ebooks (standardebooks/* on GitHub), one repository per book
  kind: literary-corpus
  url: https://github.com/standardebooks
  license: PublicDomain-US+CC0-1.0
  license_url: https://creativecommons.org/publicdomain/zero/1.0/
  license_verified: true
  license_evidence: 'Each book repository carries LICENSE.md (read 2026-10-05, e.g. charles-dickens_bleak-house): "The source
    text and artwork in this ebook are believed to be in the United States public domain … The creators of, and contributors
    to, this ebook dedicate their contributions to the worldwide public domain via the terms in the CC0 1.0 Universal Public
    Domain Dedication." US public domain + CC0 on the markup.

    '
  languages:
  - en
  domain: literature
  natural: true
  synthetic: false
  acquisition:
    method: github_org_tarballs
    org: standardebooks
    exclude_repos:
    - tools
    - .github
    ref: master
    include:
    - src/epub/text/*.xhtml
    limit: 150
    order: name-ascending
    selection_note: 'The org has 1500+ book repositories. SIR fetches a bounded, deterministically ordered subset so the run
      is reproducible and fits the environment; the limit is a resource decision and is reported in the corpus report, not
      hidden.

      '
  download_method: https://github.com/{owner}/{repo}/archive/refs/heads/master.tar.gz
  redistribution_allowed: true
  commercial_use: allowed
  derivatives: allowed
  model_training_allowed: true
  attribution_required: false
  share_alike: false
  provenance: standardebooks.org editions mirrored in per-book GitHub repositories
  size_tokens: null
  status: available
  notes: 'English only, and English is SIR''s reference language, not its target. This source exists to give the tokenizer
    and the training loop realistic narrative prose at a scale the sandbox can hold — it is NOT evidence of Indian-language
    coverage, and the report states the English share explicitly.

    '
