schema_version: 2
updated: '2026-10-05'
policy:
  require_license_record: true
  allow_unverified_license: false
  require_private_user_data: false
  require_acquisition_record_for_sizes: true
  derived_artifacts_follow_source_license: true
  require_training_permission: true
  notes: 'Permissive code licensing does not imply permissive data licensing. Model weights trained on CC BY-SA text inherit
    an open question about share-alike applicability to derived artifacts; that question must be answered before weights are
    published. The M1 corpus target (>=200M measured tokens) is NOT met by the sources available in this environment; see
    evaluation/results/corpus_report.json for the measured number and docs/corpus-report.md for the language-by-language breakdown.

    '
sources:
- id: sir_fixture_v0
  name: SIR pipeline-validation fixture corpus (self-authored)
  provider: SIR (this repository)
  kind: fixture
  url: null
  local_path: data/fixtures/sir_fixture_v0
  license: CC0-1.0
  license_url: https://creativecommons.org/publicdomain/zero/1.0/
  license_verified: true
  license_evidence: 'Authored in this repository by scripts/build_fixture_corpus.py; the author (the SIR project) dedicates
    it to the public domain. No third-party text is included.

    '
  languages:
  - hi
  - en
  - hinc-latn
  - hinc-deva
  domain: mixed-fixture
  natural: false
  natural_notes: 'Documents are COMPOSED from a seed sentence set by a seeded generator to give the pipeline realistic structure
    (paragraphs, doc boundaries, near-duplicates injected on purpose). It is not natural web text. Any metric measured only
    on this fixture is provisional and must not be published as a real-world Hindi/Hinglish capability number.

    '
  synthetic: true
  acquisition:
    method: local_fixture
    path: data/fixtures/sir_fixture_v0
    exclude_from_corpus:
    - '**/CARD.md'
    - '**/corpus_meta.json'
  download_method: local (already in the repository)
  redistribution_allowed: true
  commercial_use: allowed
  derivatives: allowed
  model_training_allowed: true
  attribution_required: false
  share_alike: false
  provenance: scripts/build_fixture_corpus.py (seeded generator, deterministic)
  size_tokens: null
  size_tokens_note: filled by training/tokenize_corpus.py into acquisition.json (measured, not typed)
  status: available
  used_for:
  - pipeline-tests
  - offline-fallback
  - tokenizer-bakeoff-provisional
  download_instructions: python -m scripts.build_fixture_corpus --out data/fixtures/sir_fixture_v0
  notes: 'Sole corpus usable offline. Size is deliberately small; it exists to prove the pipeline and to keep the acquisition
    path testable without egress.

    CARD.md and corpus_meta.json are documentation (artifacts flagged role=documentation in the ledger) and are excluded from
    the training corpus.

    '
- id: cltk_sa_wikisource
  name: Classical Sanskrit texts from Sanskrit Wikipedia (CLTK mirror)
  provider: CLTK (cltk/sanskrit_text_wikisource on GitHub)
  kind: web-corpus
  url: https://github.com/cltk/sanskrit_text_wikisource
  license: CC0-1.0
  license_url: https://creativecommons.org/publicdomain/zero/1.0/
  license_verified: true
  license_evidence: 'LICENSE (read 2026-10-05) is the full CC0 1.0 Universal text. README states the texts were taken from
    sa.wikipedia.org, whose own content license is CC BY-SA, but the corpus distributor has applied CC0 to the compilation.
    CC0 grants unconditional use, so no attribution/share-alike obligation survives even if one applied upstream.

    '
  languages:
  - sa
  domain: encyclopedic-classical
  natural: true
  synthetic: false
  acquisition:
    method: github_tarball
    repo: cltk/sanskrit_text_wikisource
    ref: master
    include:
    - wiki_documents/**
    - cltk_json/*.json
    exclude:
    - '**/*.py'
  download_method: https://github.com/{repo}/archive/refs/heads/{ref}.tar.gz
  redistribution_allowed: true
  commercial_use: allowed
  derivatives: allowed
  model_training_allowed: true
  attribution_required: false
  share_alike: false
  provenance: sa.wikipedia.org articles mirrored by the CLTK project; per-file names preserved
  size_tokens: null
  status: available
  notes: 'Devanagari sources in modern orthography; contains prose and verse articles, useful for Devanagari coverage. Not
    modern conversational Hindi — do not present it as Hindi.

    '
- id: cltk_sa_gitasupersite
  name: Sanskrit texts + Ramcharitmanas (gitasupersite mirror)
  provider: CLTK (cltk/sanskrit_text_gitasupersite on GitHub)
  kind: literary-corpus
  url: https://github.com/cltk/sanskrit_text_gitasupersite
  license: PublicDomainMark-1.0
  license_url: https://creativecommons.org/publicdomain/mark/1.0/
  license_verified: true
  license_evidence: 'LICENSE.md (read 2026-10-05) is the Creative Commons Public Domain Mark 1.0 — "No Copyright … free of
    known restrictions under copyright law, including all related and neighboring rights … even for commercial purposes".
    The underlying works (Bhagavad Gita, Ramayana, Ramcharitmanas, Brahma Sutra, Yoga Sutra) are pre-1600 compositions.

    '
  languages:
  - sa
  - hi
  domain: literature-religious
  natural: true
  synthetic: false
  acquisition:
    method: github_tarball
    repo: cltk/sanskrit_text_gitasupersite
    ref: master
    include:
    - bhagavadgita/*.txt
    - brahmasutra/*.txt
    - minigita/*.txt
    - ramayana/*.txt
    - ramcharitmanas/*.txt
    - yogasutra/*.txt
    language_by_path:
      ramcharitmanas/**: hi
      '**': sa
  download_method: https://github.com/{repo}/archive/refs/heads/{ref}.tar.gz
  redistribution_allowed: true
  commercial_use: allowed
  derivatives: allowed
  model_training_allowed: true
  attribution_required: false
  share_alike: false
  provenance: gitasupersite.iitk.ac.in transcriptions, mirrored by CLTK; file names preserved
  size_tokens: null
  status: available
  notes: 'ramcharitmanas/* is Tulsidas'' Awadhi Hindi written in Devanagari and is declared as ''hi'' here; it is 16th-century
    Awadhi, NOT modern standard Hindi. The corpus report labels it accordingly and it must not be used as evidence of modern-Hindi
    coverage.

    '
