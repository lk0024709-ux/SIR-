# SIR-Nano SMOKE — the configuration that was ACTUALLY EXECUTED in this environment.
# =============================================================================
# Everything in this file has been run on a CPU-only 2-core / 3 GB sandbox over the
# self-authored fixture corpus. It exists to prove the pipeline works end to end
# (data -> tokenizer -> model -> train -> checkpoint -> eval -> CPU inference).
#
# It is NOT SIR-Nano v0.1. The model is ~1M parameters, not ~25M, because the
# environment cannot train or meaningfully evaluate a 25M-parameter model on a
# 162 KB fixture corpus. Do not describe this as a trained language model milestone.
# =============================================================================

status:
  trained: true
  milestone: "M1 pipeline validation (partial)"
  not_milestone: >
    This does not satisfy M1 acceptance. The corpus is a composed fixture and the model is
    two orders of magnitude too small; perplexity, token-efficiency and latency numbers
    derived from it are provisional and must be labelled as such.
  last_verified: "2026-10-05"

experiment:
  name: sir_nano_smoke
  objective: >
    Prove every stage runs, produces machine-readable artifacts, and reproduces from the
    same seed on the smallest defensible data and model.

seed: 20261005

runtime:
  device: auto
  threads: 1               # 1 thread keeps eval runs comparable
  dtype: float32
  amp: false               # CPU: AMP would change numerics without saving time
  compile: false

paths:
  processed_dir: data/processed/smoke
  tokenizer_dir: tokenizer/artifacts/smoke
  run_dir: runs/sir_nano_smoke
  results_dir: evaluation/results

dataset:
  sources: [sir_fixture_v0]
  min_tokens_total: 0
  require_natural_corpus: false
  clean:
    min_chars: 120
    max_chars: 100_000
    min_alnum_ratio: 0.35
    max_symbol_ratio: 0.35
    recover_mojibake: true
  dedup:
    num_perm: 64
    band_size: 8
    threshold: 0.8
    shingle_chars: 24
  split:
    val_frac: 0.08
    test_frac: 0.0
    seed: 20261005
    group_by: auto      # leakage-safe: documents sharing a sentence or an 8-gram stay on one side
    leak_ngram: 8

tokenizer:
  candidates: [byte_bpe, sp_bpe, sp_unigram]
  baseline_for_acceptance: byte_bpe
  vocab_sizes: [1024, 2048]
  chosen_vocab_size: null
  special_tokens: ["<pad>", "<unk>", "<s>", "</s>"]
  byte_fallback_required: true
  acceptance:
    hindi_token_reduction_vs_baseline: 0.15
    hinglish_token_reduction_vs_baseline: 0.10
  eval_slice_min_chars: 50_000

model:
  # No parameter claim is made for the smoke run — it is a pipeline test at whatever size the
  # smoke architecture implies. target_params exists so v0.1 cannot quietly become a smaller
  # model; a run whose actual count drifts >10% from a declared target aborts (model/config.py).
  target_params: null
  vocab_size: 2048
  d_model: 128
  n_layers: 4
  n_heads: 4
  d_ff: 352
  max_seq_len: 64
  dropout: 0.0
  tied_embeddings: true
  norm: pre_layernorm
  activation: gelu
  positional: learned_absolute
  attention: sdpa_causal
  init_std: 0.02
  pad_token_id: 0
  eos_token_id: 3

training:
  batch_size: 16
  seq_len: 64
  window_stride: 32        # slide windows so short documents still contribute several of them
  accumulation_steps: 1
  lr: 3.0e-3
  min_lr: 3.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.0
  grad_clip: 1.0
  warmup_steps: 30
  schedule: cosine
  max_steps: 400
  eval_every: 40
  eval_batches: 32
  log_every: 20
  num_workers: 0
  resume: auto

evaluation:
  probes: evaluation/probes/m1_probe_v0.jsonl
  probe_min_prompts: 50
  leak_ngram: 8
  degeneracy:
    repeated_ngram_n: 8
    max_run_tokens: 32
    min_unique_ngram_ratio: 0.35   # <35% distinct 4-grams => phrase-level looping
    max_tail_cycle_cover: 0.50     # a <=16-token cycle covering >50% of the output => loop
    max_char_dominance: 0.60       # one character making up >60% of the text => hammering a glyph
    pass_rate_target: 0.50
  reproducibility:
    runs: 2
    tolerance_pct: 2.0
  cpu_latency:
    tokens: 128
    max_seconds: 2.0
    repeats: 3

checkpoint:
  keep_last: 2
  save_optimizer: true
  include: [weights, config, tokenizer_spec, step, seed, val_loss, git_commit, environment]
  commit_checkpoints_to_git: false
