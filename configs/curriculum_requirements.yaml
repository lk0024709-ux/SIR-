# SIR curriculum requirements — the contract a curriculum graph must satisfy.
#
# This file is the *requirement*, data/curriculum/curriculum_graph.yaml is the *implementation*.
# curriculum/requirements.py checks one against the other, so a topic listed in a task brief cannot
# silently disappear from the graph: either a node carries the topic tag, or validation fails.
#
# Adding a requirement here without adding graph coverage is a failing build, not a warning.

schema_version: 1

