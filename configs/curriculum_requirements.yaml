# Capabilities that are cross-cutting rather than school subjects.
required_capability_topics:
  - brainstorming
  - idea_generation
  - synthesis
  - problem_decomposition
  - planning
  - cross_domain_connections
  - verification
  - transfer
  - error_analysis

# Subjects whose foundation ladder must cover these grades (inclusive).
required_grade_coverage:
  mathematics: [1, 10]
  science: [1, 10]
  social_science: [1, 10]
  hindi: [1, 10]
  english: [1, 10]
  indian_languages: [1, 10]
  computer_science: [1, 10]
  reasoning: [1, 10]
  general_knowledge: [1, 10]

# Ordered chains that must exist as real dependencies, not as prose.
required_sequences:
  scientific_thinking:
    - st.g04
    - st.g05
    - st.g06
    - st.g07
    - st.g08
    - st.g09
    - st.g10

# The human-like learning loop. These stage names must be usable as record kinds and as
# assessment kinds, so the loop is executable rather than aspirational.
learning_loop:
  - learn
  - practice
  - error_diagnosis
  - correction
  - application
  - explanation
  - verification
  - transfer
  - review
  - progression

# Development generations. Order is contractual: no generation may be skipped and ids are stable.
generation_order:
  - nano
  - lite
  - flash_lite
  - flash
  - pro
  - pro_plus
  - pro_max
  - ultra
  - expert

# Tracks that must be non-empty for the program to be considered wired up.
required_tracks:
  - foundation
  - bridge
  - advanced
  - meta
