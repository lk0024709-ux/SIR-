# SIR curriculum sampling & coverage policy.
#
# Two decisions that are easy to fake and therefore are explicit here:
#
# 1. WHAT the trainer sees. The mixture is configuration, not code, because the right balance
#    (new material vs. review vs. weak areas vs. transfer vs. error correction) is an empirical
#    question. Changing it must be a config change with a recorded experiment, not a code edit.
# 2. WHEN a node counts as mastered. Thresholds live here so a promotion argument can be had in
#    one place, and coverage reports can quote the exact numbers they used.

schema_version: 1

sampler:
  # Shares of a batch. Must sum to 1.0 (tolerance 0.01). Any bucket that cannot be filled
  # redistributes its shortfall to `current` and reports it — never silently drops the batch size.
  mixture:
    current: 0.65
    review: 0.15
    weak_areas: 0.10
    transfer: 0.05
    error_correction: 0.05
  # Difficulty preference inside a bucket. Used as a soft target, reported as achieved-vs-target.
  difficulty_mix:
    beginner: 0.15
    elementary: 0.25
    intermediate: 0.30
    advanced: 0.20
    expert: 0.07
    olympiad: 0.03
  # Language preference inside a bucket, applied as a soft target. Indian-first by design.
  language_mix:
    hi: 0.35
    en: 0.30
    hinc-latn: 0.20
    hinc-deva: 0.05
    multi: 0.05
    other: 0.05
  max_items: 2000
  seed: 20261007
  redistribute_shortfall: true

coverage:
  practice_min_attempts: 3
  mastery_min_attempts: 8
  mastery_accuracy: 0.80
  min_difficulty: intermediate
  require_transfer: true
  require_verification: true
  weak_accuracy: 0.60

review:
  intervals_days: [1, 3, 7, 16, 35, 75, 160]
  promote_threshold: 0.80
  reset_threshold: 0.60

# Data-generation policy for the teacher pipeline. Volumes are *targets* the pipeline reports
# against; nothing here is a promise that material exists.
generation:
  kinds_per_node: [learn, practice, application, verification, transfer]
  languages: [hi, en, hinc-latn]
  difficulties: [beginner, elementary, intermediate, advanced]
  min_teachers: 2
  allow_single_teacher: false
  require_verification_for: [verification, transfer, application]
  max_records_per_node: 60

# Training-readiness thresholds. These encode the project's own earlier decision: a serious
# pretraining run needs measured tokens, not a hopeful dataset size.
readiness:
  serious_pretraining_min_train_tokens: 200000000
  partial_training_min_train_tokens: 50000000
  min_curriculum_requirement_pass: true
  min_coverage_nodes_assessed: 1
  require_experiment_tracking: true
  require_regression_baseline: false
