# SIR generation contracts — what each developmental generation must be and must prove.
#
# A generation label (SIR-Nano → SIR-Expert) is a *developmental stage*, not a parameter count and
# not a marketing tier. Nothing here is an achievement claim: `training_status` and
# `verification_status` say what is actually true today, and `development/generations.py` refuses
# configurations whose status vocabulary would let a reader believe otherwise.
#
# Honesty rules enforced by code (see development/generations.py):
#   * a status that claims training requires evidence paths;
#   * TRAINED_VERIFIED requires verification_status: VERIFIED;
#   * PLANNED / ARCHITECTURE_ONLY must state known limitations;
#   * generation ids and names must match configs/sir_human_development.yaml exactly (stable labels).

schema_version: 1
namespace: sir

# Evaluation axes used by promotion gates (evaluation/suite.py produces results per axis).
evaluation_axes:
  knowledge: "factual and curriculum QA, including multilingual items"
  mathematics: "arithmetic, algebra, geometry, probability, calculus"
  science: "physics, chemistry, biology fundamentals"
  language: "Hindi, English, Hinglish, other Indian languages — comprehension and production"
  reasoning: "logical, mathematical, causal, abstract, planning"
  coding: "program understanding, debugging, algorithmic reasoning"
  application: "real-world multi-step problems"
  transfer: "same concept in an unseen context (the anti-memorisation axis)"
  verification: "detecting wrong answers, hallucination traps, checking claims"
  brainstorming: "diverse, feasible, verified idea generation and synthesis"
  reliability: "uncertainty handling, contradiction handling, refusal to fabricate"

generations:
  - generation_id: nano
    name: SIR-Nano
    training_stage: foundation
    model_config_ref: configs/sir_nano_v0_1.yaml
    target_params: 25000000
    curriculum_scope:
      tracks: [foundation, meta]
      bands: [primary, middle, secondary, cross_cutting]
      grades: [1, 10]
    target_capabilities:
      - basic language (Hindi, English, Hinglish) comprehension and simple generation
      - simple arithmetic and word problems
      - pattern recognition and short structured reasoning
      - short, concise explanations with a stated answer
      - honest "I am not sure" behaviour instead of fabricated answers
    required_evaluations: [knowledge, mathematics, language, reasoning, transfer, reliability]
    promotion_requirements:
      min_cases_per_axis: 5
      min_axis_scores: {knowledge: 0.35, mathematics: 0.35, language: 0.35, reasoning: 0.30, transfer: 0.25, reliability: 0.50}
      require_verified_evidence: true
      require_no_leakage: true
      require_reproducibility: true
      require_no_axis_regression: true
      regression_tolerance: 0.02
    known_limitations:
      - 25M parameters cannot hold the full Class 1-10 curriculum; coverage will be partial and must be reported per node
      - long-form reasoning and multi-step planning will be unreliable at this size
      - factual breadth will be limited to what the licensed corpus actually contains
    training_status: UNTRAINED
    verification_status: UNVERIFIED
    evidence:
      - evaluation/results/lm_eval.json
      - evaluation/results/generation_probes.json
    evidence_note: >
      These two files are smoke-run pipeline validation (0.9M parameters, fixture corpus). They prove
      the machinery runs; they are NOT evidence for the 25M Nano target and must not be cited as
      capability evidence for any generation.

