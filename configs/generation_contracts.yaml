    promotion_requirements:
      min_cases_per_axis: 10
      min_axis_scores: {knowledge: 0.50, mathematics: 0.50, science: 0.45, language: 0.50, reasoning: 0.45, application: 0.40, transfer: 0.40, verification: 0.45, reliability: 0.60}
      require_verified_evidence: true
      require_no_leakage: true
      require_reproducibility: true
      require_no_axis_regression: true
      regression_tolerance: 0.02
    known_limitations:
      - no generation of SIR-Lite exists yet; this contract is a target, not a description
